# 发版：推 v<版本> 标签，三平台并行打包，直接挂到同一个 Release。
#
# 推单平台标签只打那一个平台：macos-v<版本> / windows-v<版本> / linux-v<版本>。
#   gh tag push v0.1.0            # 三平台
#   gh tag push windows-v0.1.0    # 只出 Windows
#
# 版本号从标签读，不校验 Cargo.toml —— 壳的版本号只在「关于」页显示，与发版标签
# 无关，绑死反而每次发版都要改三个文件。
#
# 产物：
#   macOS    Zha-<版本>-macos-<系统版本>.pkg（arm64 + x86_64 通用）
#   Windows  Zha-<版本>-windows-<系统版本>-setup.exe
#   Linux    Zha-<版本>-linux.tar.gz（AppImage 解包）
#
# 代码签名/公证是可选的，配了下面这些 secret 才做，没配就出未签名包
# （未签名的 macOS 包只能自己右键打开，Windows 会弹 SmartScreen）：
#   ZHA_CERT_P12           Developer ID Application + Installer 两张证书导出的 .p12，base64
#   ZHA_CERT_PASSWORD      .p12 的密码
#   ZHA_SIGN_IDENTITY      "Developer ID Application: 名字 (TEAMID)"
#   ZHA_INSTALLER_IDENTITY "Developer ID Installer: 名字 (TEAMID)"
#   ZHA_NOTARY_KEY         App Store Connect API 密钥 .p8，base64
#   ZHA_NOTARY_KEY_ID      密钥的 Key ID
#   ZHA_NOTARY_ISSUER      密钥的 Issuer ID
#
# 不做的事：不生成 releases.json、不签版本索引、不触发任何官网——软件里没有自动检查更新，
# 下载走 GitHub Releases 页面本身。
name: release

on:
  push:
    tags: ['v*', 'macos-v*', 'windows-v*', 'linux-v*']
  workflow_dispatch:          # 手动重跑，不用再打一个新标签

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    if: startsWith(github.ref, 'refs/tags/macos-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # bundle.sh 用提交数当构建号
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch product data
        run: tools/release/data-fetch.sh

      - name: Import signing certificates
        if: env.ZHA_CERT_P12 != ''
        env:
          ZHA_CERT_P12: ${{ secrets.ZHA_CERT_P12 }}
          ZHA_CERT_PASSWORD: ${{ secrets.ZHA_CERT_PASSWORD }}
          ZHA_SIGN_IDENTITY: ${{ secrets.ZHA_SIGN_IDENTITY }}
          ZHA_INSTALLER_IDENTITY: ${{ secrets.ZHA_INSTALLER_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$ZHA_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$ZHA_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          {
            echo "QINGJIAN_SIGN_IDENTITY=$ZHA_SIGN_IDENTITY"
            echo "QINGJIAN_INSTALLER_IDENTITY=$ZHA_INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: secrets.ZHA_NOTARY_KEY != ''
        env:
          ZHA_NOTARY_KEY: ${{ secrets.ZHA_NOTARY_KEY }}
          ZHA_NOTARY_KEY_ID: ${{ secrets.ZHA_NOTARY_KEY_ID }}
          ZHA_NOTARY_ISSUER: ${{ secrets.ZHA_NOTARY_ISSUER }}
        run: |
          echo "$ZHA_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials zha --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ZHA_NOTARY_KEY_ID" --issuer "$ZHA_NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "QINGJIAN_NOTARY_PROFILE=zha" >> "$GITHUB_ENV"

      - name: Build pkg (arm64)
        run: QINGJIAN_TARGET=aarch64-apple-darwin apps/macos/scripts/bundle.sh --pkg

      - name: Build pkg (x86_64)
        run: QINGJIAN_TARGET=x86_64-apple-darwin apps/macos/scripts/bundle.sh --pkg

      - name: Upload
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: target/pkg/*.pkg

  windows:
    if: startsWith(github.ref, 'refs/tags/windows-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch product data
        run: tools/release/data-fetch.sh

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" "apps\windows\installer\qingjian.iss"

      - name: Upload
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: target/installer/*.exe

  linux:
    if: startsWith(github.ref, 'refs/tags/linux-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Fcitx5 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfcitx5-dev pkg-config devscripts cmake

      - name: Fetch product data
        run: tools/release/data-fetch.sh

      - name: Build package
        run: apps/linux/scripts/package.sh

      - name: Upload
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: target/linux-package/*.tar.gz
